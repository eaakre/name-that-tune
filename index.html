<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#1534c8">
<title>Name That Tune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.hero{color:#fff;text-align:center;padding:8px 0 22px}
.hero h1{font-size:clamp(34px,9vw,52px)}
.hero p{margin:10px auto 0;max-width:30ch;opacity:.9}
.joincard{max-width:460px;margin:0 auto}
#code{text-transform:uppercase;letter-spacing:.3em;font-family:Bungee,sans-serif;font-size:26px;text-align:center}
.hostlink{display:block;text-align:center;color:#fff;margin-top:22px;font-weight:600}
/* play view */
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;color:#fff;max-width:560px;margin:0 auto 6px}
.bar .me{font-weight:700;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .pts{font-family:Bungee,sans-serif;font-size:28px;color:var(--lemon);white-space:nowrap}
.status{color:#fff;text-align:center;font-size:clamp(20px,5.5vw,26px);font-weight:700;min-height:2.6em;display:flex;align-items:center;justify-content:center;padding:0 8px;max-width:560px;margin:0 auto;text-wrap:balance}
.podium{display:grid;place-items:center;padding:8px 0 24px}
#buzz{width:min(78vw,340px);aspect-ratio:1;border-radius:50%;border:0;padding:0;font-family:Bungee,sans-serif;font-size:clamp(40px,12vw,64px);color:#fff;cursor:pointer;
  background:radial-gradient(circle at 35% 28%,#ff8a73 0,var(--red) 38%,var(--redDk) 100%);
  box-shadow:0 18px 0 #7d1200,0 30px 50px rgba(0,0,0,.35),inset 0 -10px 24px rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s,filter .2s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#buzz:active:not(:disabled),#buzz.pressed{transform:translateY(14px);box-shadow:0 4px 0 #7d1200,0 10px 20px rgba(0,0,0,.35),inset 0 -6px 16px rgba(0,0,0,.25)}
#buzz:disabled{filter:grayscale(.85) brightness(.75);cursor:default}
#buzz.live{animation:pulse 1.4s ease-in-out infinite}
#buzz.mine{background:radial-gradient(circle at 35% 28%,#fff3a6 0,var(--lemon) 40%,#d9b400 100%);color:#10142b;box-shadow:0 18px 0 #8a7200,0 30px 50px rgba(0,0,0,.35);filter:none}
@keyframes pulse{50%{box-shadow:0 18px 0 #7d1200,0 30px 60px rgba(255,59,31,.55),inset 0 -10px 24px rgba(0,0,0,.25)}}
.answer{display:flex;gap:14px;align-items:center;max-width:560px;margin:0 auto 18px}
.answer img{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none}
.answer .t{font-size:18px;white-space:normal}
.board{max-width:560px;margin:0 auto}
.board li.you .t::after{content:" (you)";color:var(--soft);font-weight:400}
.leave{display:block;margin:18px auto 0;color:#fff;background:transparent;border:2px solid rgba(255,255,255,.4)}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./">Name That <b>Tune</b></a></header>

<main class="wrap">
  <section id="joinView">
    <div class="hero"><h1>Buzz in. Name it.</h1><p>Enter the game code from your host, pick a name, and get your finger ready.</p></div>
    <form class="card joincard" id="joinForm" autocomplete="off">
      <label for="code">Game code</label>
      <input id="code" maxlength="4" inputmode="text" autocapitalize="characters" placeholder="ABCD" required>
      <label for="name">Your name</label>
      <input id="name" maxlength="24" placeholder="e.g. Jordan" required>
      <p class="err" id="joinErr" role="alert"></p>
      <button class="primary" style="width:100%;font-size:18px;min-height:54px" id="joinBtn">Join game</button>
    </form>
    <a class="hostlink" href="host.html">Running the game? Host it here →</a>
  </section>

  <section id="playView" class="hide">
    <div class="bar"><span class="me" id="meName"></span><span class="pts" id="mePts">0</span></div>
    <div class="status" id="status" aria-live="polite">Connecting…</div>
    <div class="podium"><button id="buzz" disabled aria-label="Buzz in">BUZZ</button></div>
    <div class="card answer hide" id="answer"></div>
    <div class="card board"><h2>Scores</h2><ol class="list" id="board"></ol></div>
    <button class="leave" id="leave">Leave game</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="common.js"></script>
<script>
{
  const KEY = 'buzz_player';
  let me = store.get(KEY), game, players, stop = null, pressing = false;

  const params = new URLSearchParams(location.search);
  if (params.get('code')) $('#code').value = params.get('code').toUpperCase().slice(0, 4);
  const lastName = store.get('buzz_last_name'); if (lastName) $('#name').value = lastName;

  $('#joinForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('#joinErr').textContent = ''; $('#joinBtn').disabled = true;
    try {
      const r = await rpc('buzz_join', { p_code: $('#code').value, p_name: $('#name').value });
      me = r; store.set(KEY, r); store.set('buzz_last_name', r.name);
      enter();
    } catch (err) { $('#joinErr').textContent = err.message; }
    $('#joinBtn').disabled = false;
  });

  function enter() {
    $('#joinView').classList.add('hide'); $('#playView').classList.remove('hide');
    $('#meName').textContent = me.name;
    history.replaceState(null, '', location.pathname);
    stop = watchGame(me.game_id, g => { game = g; render(); }, p => { players = p; render(); });
  }

  function leave() {
    if (stop) stop(); stop = null; store.del(KEY); me = null; game = undefined; players = undefined;
    $('#playView').classList.add('hide'); $('#joinView').classList.remove('hide');
  }
  $('#leave').addEventListener('click', leave);

  const nameOf = id => players.find(p => p.id === id)?.name || 'Someone';

  function render() {
    if (!me || game === undefined || players === undefined) return; // still loading
    if (game === null) { leave(); $('#joinErr').textContent = 'That game is no longer running.'; return; }
    if (players.length && !players.some(p => p.id === me.player_id)) { leave(); $('#joinErr').textContent = 'You were removed from the game. You can join again.'; return; }
    const mine = players.find(p => p.id === me.player_id);
    $('#mePts').textContent = mine ? mine.score : 0;

    const b = $('#buzz'), s = $('#status');
    b.classList.remove('live', 'mine'); b.disabled = true; b.textContent = 'BUZZ';
    const out = game.locked_out?.includes(me.player_id);
    const st = game.status;
    if (st === 'lobby') s.textContent = 'You’re in! Waiting for the first song…';
    else if (st === 'open' && out) s.textContent = 'Wrong guess — you’re out for this song.';
    else if (st === 'open') { s.textContent = 'Listen… buzz when you know it!'; b.disabled = pressing; b.classList.add('live'); }
    else if (st === 'locked' && game.buzz_player_id === me.player_id) { s.textContent = 'You’re up! Say the song and the artist.'; b.classList.add('mine'); b.textContent = 'YOU!'; }
    else if (st === 'locked' && game.buzz_player_id) s.textContent = nameOf(game.buzz_player_id) + ' buzzed in';
    else if (st === 'locked') s.textContent = 'Buzzers paused';
    else if (st === 'scored') s.textContent = game.answer?.by ? game.answer.by + ' got it!' : 'Nobody got that one';
    else if (st === 'ended') s.textContent = 'Game over — thanks for playing!';

    const a = $('#answer');
    if (st === 'scored' && game.answer) {
      a.innerHTML = (game.answer.art ? `<img src="${esc(game.answer.art)}" alt="">` : '') +
        `<div class="meta"><div class="s">The answer was</div><div class="t">${esc(game.answer.title)}</div><div class="s" style="white-space:normal">${esc(game.answer.artist)}</div></div>`;
      a.classList.remove('hide');
    } else a.classList.add('hide');

    const sorted = [...players].sort((x, y) => y.score - x.score || x.joined_at.localeCompare(y.joined_at));
    $('#board').innerHTML = sorted.map(p => `<li class="${p.id === me.player_id ? 'you' : ''}"><div class="meta"><div class="t">${esc(p.name)}</div></div><span class="score">${p.score}</span></li>`).join('')
      || '<li class="muted">No players yet</li>';
  }

  async function press() {
    if (!me || !game || game.status !== 'open' || pressing || game.locked_out?.includes(me.player_id)) return;
    pressing = true; const b = $('#buzz'); b.classList.add('pressed'); b.disabled = true;
    try {
      const r = await rpc('buzz_press', { p_player_id: me.player_id, p_secret: me.player_secret });
      if (r.won) { try { navigator.vibrate?.(200); } catch {} game = { ...game, status: 'locked', buzz_player_id: me.player_id }; }
      else toast('Too slow — someone beat you!');
    } catch (err) { toast(err.message); }
    pressing = false; b.classList.remove('pressed'); render();
  }
  $('#buzz').addEventListener('click', press);
  document.addEventListener('keydown', e => { if (e.code === 'Space' && !$('#playView').classList.contains('hide') && e.target.tagName !== 'INPUT') { e.preventDefault(); press(); } });

  const urlCode = (params.get('code') || '').toUpperCase();
  if (me && me.game_id && (!urlCode || urlCode === me.code)) enter();
}
</script>
</body>
</html>
